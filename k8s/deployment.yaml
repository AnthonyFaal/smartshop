apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshop-web
  labels:
    app: smartshop
    component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smartshop
      component: web
  template:
    metadata:
      labels:
        app: smartshop
        component: web
    spec:
      containers:
        - name: smartshop
          image: smartshop:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: smartshop-secrets
            - configMapRef:
                name: smartshop-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smartshop-web
spec:
  selector:
    app: smartshop
    component: web
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartshop-web-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartshop-web
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
